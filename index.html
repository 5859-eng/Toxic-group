<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินดัชนีความสัมพันธ์ข้ามบุคคล (PSTI)</title>
    
    <!-- ดึง CDN html2pdf.js สำหรับแปลง HTML เป็น PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 20px; line-height: 1.6; background-color: #f9f9f9; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .question-block { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .question-title { font-weight: bold; margin-bottom: 10px; }
        .options { display: flex; gap: 10px; flex-wrap: wrap; }
        .options label { cursor: pointer; background: #f0f0f0; padding: 8px 12px; border-radius: 4px; }
        .options input[type="radio"] { margin-right: 5px; }
        
        /* ปุ่มการทำงาน */
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn-submit { background-color: #4CAF50; color: white; }
        .btn-submit:hover { background-color: #45a049; }
        .btn-pdf { background-color: #008CBA; color: white; margin-left: 10px; }
        .btn-pdf:hover { background-color: #007b9a; }

        /* ส่วนแสดงผลลัพธ์ที่จะพิมพ์ลง PDF */
        #result { margin-top: 20px; padding: 20px; background: #ffffff; border: 1px solid #2196F3; border-left: 6px solid #2196F3; border-radius: 4px; display: none; }
        .result-header { font-size: 20px; font-weight: bold; color: #2196F3; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .result-detail { font-size: 16px; margin-bottom: 8px; }
        .result-footer { font-size: 12px; color: #666; margin-top: 15px; }
        .action-buttons { margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินดัชนีความสัมพันธ์ข้ามบุคคล (PSTI)</h2>
    <form id="quizForm"></form>
    
    <button type="button" class="btn btn-submit" onclick="calculateAndShowResult()">ประเมินผล</button>

    <!-- กล่องแสดงผลลัพธ์ (เป้าหมายของการส่งออก PDF) -->
    <div id="result">
        <div class="result-header">ผลการประเมินดัชนีความสัมพันธ์ข้ามบุคคล (PSTI)</div>
        <div id="resultContent"></div>
    </div>

    <!-- ปุ่มสำหรับดาวน์โหลด PDF (จะปรากฏเมื่อประเมินเสร็จสิ้น) -->
    <div id="actionButtons" class="action-buttons">
        <button type="button" class="btn btn-pdf" onclick="exportToPDF()">ดาวน์โหลดผลประเมิน (PDF)</button>
    </div>
</div>

<script>
// 1. รายการคำถามพร้อม flag isReverse สำหรับคำถามเชิงบวก
const questionsList = [
    // หมวด 1: ขอบเขตและสิทธิส่วนบุคคล
    { catId: 1, text: "1. คุณชอบซักไซ้เรื่องส่วนตัวหรือกดดันให้ผู้อื่นเล่าเรื่องที่เขาไม่อยากพูดถึงหรือไม่?" },
    { catId: 1, text: "2. เมื่อผู้อื่นปฏิเสธคำขอของคุณ คุณมักจะตื๊อ ตระหนี่อารมณ์ หรือทำให้เขารู้สึกผิดหรือไม่?" },
    { catId: 1, text: "3. คุณหยิบยืมสิ่งของ โทรศัพท์ หรือใช้พื้นที่ของคนอื่นโดยไม่ได้รับอนุญาตล่วงหน้าหรือไม่?" },
    { catId: 1, text: "4. คุณมักจะวิจารณ์สไตล์การแต่งตัว รสนิยม หรือวิถีชีวิตของคนรอบข้างตรงๆ โดยที่เขาไม่ได้ขอความเห็นหรือไม่?" },
    { catId: 1, text: "5. คุณเคารพเวลาส่วนตัวของผู้อื่น (เช่น ไม่ทักงานหรือตามงานนอกเวลาโดยไม่จำเป็น) หรือไม่?", isReverse: true },

    // หมวด 2: การสื่อสารและอารมณ์
    { catId: 2, text: "6. เมื่อเกิดความขัดแย้ง คุณมักใช้วิธีเงียบใส่ (Silent Treatment) เพื่อลงโทษอีกฝ่ายหรือไม่?" },
    { catId: 2, text: "7. คุณมักใช้วาจาประชดประชัน คอยแซะ หรือใช้น้ำเสียงกดดันผู้ฟังหรือไม่?" },
    { catId: 2, text: "8. คุณมักจะระเบิดอารมณ์ใส่อีกฝ่ายเมื่อไม่ได้อย่างใจ แล้วค่อยขอโทษทีหลังหรือไม่?" },
    { catId: 2, text: "9. คุณมักพูดขัดจังหวะขณะที่ผู้อื่นกำลังอธิบายความคิดเห็นของเขาหรือไม่?" },
    { catId: 2, text: "10. คุณฟังเพื่อหาจุดผิดพลาดไปโต้กลับ มากกว่าฟังเพื่อทำความเข้าใจความรู้สึกของอีกฝ่ายหรือไม่?" },

    // หมวด 3: ความซื่อสัตย์และการรับผิดชอบ
    { catId: 3, text: "11. เมื่อทำผิด คุณมักจะหาเหตุผลอ้างหรือโยนความผิดให้คนอื่นหรือสิ่งแวดล้อมหรือไม่?" },
    { catId: 3, text: "12. คุณมักปิดบังข้อมูลสำคัญหรือพูดความจริงไม่หมดเพื่อให้ตนเองดูดีหรือไม่?" },
    { catId: 3, text: "13. คุณเคยนำเรื่องลับหรือเรื่องอับอายของผู้อื่นไปเล่าต่อหรือไม่?" },
    { catId: 3, text: "14. คุณมักจะผิดสัญญาหรือผิดนัดโดยไม่แจ้งล่วงหน้าบ่อยครั้งหรือไม่?" },
    { catId: 3, text: "15. คุณยินดีรับฟังเมื่อมีคนตักเตือนพฤติกรรมของคุณโดยไม่ออกตัวปกป้องตนเองทันทีหรือไม่?", isReverse: true },

    // หมวด 4: ความเห็นอกเห็นใจและการสนับสนุน
    { catId: 4, text: "16. เมื่อผู้อื่นประสบความสำเร็จ คุณมักรู้สึกอิจฉา หรือพยายามพูดลดทอนความสำเร็จของเขาหรือไม่?" },
    { catId: 4, text: "17. คุณมักจะเปลี่ยนหัวข้อสนทนาให้กลับมาเป็นเรื่องของตัวเองเสมอหรือไม่?" },
    { catId: 4, text: "18. คุณมักจะเสนอคำแนะนำหรือแก้ปัญหาให้ผู้อื่นทันที ทั้งที่เขาแค่อยากได้รับการรับฟังหรือไม่?" },
    { catId: 4, text: "19. คุณมักจะตัดสินว่าปัญหาของคนอื่นเป็นเรื่องเล็กหรือไม่สมเหตุสมผลหรือไม่?" },
    { catId: 4, text: "20. คุณแสดงความยินดีอย่างจริงใจเมื่อคนรอบข้างได้รับข่าวดีหรือไม่?", isReverse: true },

    // หมวด 5: การควบคุมและการครอบงำ
    { catId: 5, text: "21. คุณมักจะเรียกร้องให้อีกฝ่ายตอบข้อความหรือรับสายทันทีหรือไม่?" },
    { catId: 5, text: "22. คุณพยายามเช็กหรือตรวจสอบการใช้งานสื่อสังคมออนไลน์หรือตำแหน่งของคนใกล้ชิดหรือไม่?" },
    { catId: 5, text: "23. คุณมักจะทำให้ผู้อื่นสงสัยในความทรงจำหรือการตัดสินใจของตนเอง (Gaslighting) หรือไม่?" },
    { catId: 5, text: "24. คุณมักใช้วิธีขู่ว่าจะตัดความสัมพันธ์หรือทำร้ายตัวเองเพื่อให้ได้ในสิ่งที่ต้องการหรือไม่?" },
    { catId: 5, text: "25. คุณเคารพการตัดสินใจของผู้อื่น แม้ว่าการตัดสินใจนั้นจะไม่ตรงกับความต้องการของคุณหรือไม่?", isReverse: true }
];

const optionLabels = [
    { text: "ไม่เคยเลย", val: 0 },
    { text: "นานๆ ครั้ง", val: 1 },
    { text: "บางครั้ง", val: 2 },
    { text: "บ่อยครั้ง", val: 3 },
    { text: "ทำประจำ", val: 4 }
];

// 2. แสดงรายการคำถาม
function renderQuiz() {
    const form = document.getElementById('quizForm');
    let html = '';

    questionsList.forEach((q, idx) => {
        html += `
            <div class="question-block">
                <div class="question-title">${q.text}</div>
                <div class="options">
                    ${optionLabels.map(opt => `
                        <label>
                            <input type="radio" name="q_${idx}" value="${opt.val}" required>
                            ${opt.text}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
    });

    form.innerHTML = html;
}

// 3. ฟังก์ชันคำนวณคะแนน
function calculateAndShowResult() {
    const form = document.getElementById('quizForm');
    if (!form.checkValidity()) {
        alert('กรุณาตอบคำถามให้ครบทุกข้อก่อนประเมินผลครับ');
        return;
    }

    let totalScore = 0;
    const maxScore = questionsList.length * 4;

    questionsList.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        if (selected) {
            let score = parseInt(selected.value);
            
            // Reverse score สำหรับคำถามเชิงบวก
            if (q.isReverse) {
                score = 4 - score;
            }

            totalScore += score;
        }
    });

    const overallPercent = Math.round((totalScore / maxScore) * 100);
    const dateStr = new Date().toLocaleString('th-TH');

    // บันทึกผลลัพธ์ลง LocalStorage
    localStorage.setItem('psti_last_score', overallPercent);
    localStorage.setItem('psti_last_date', dateStr);

    // แสดงรายละเอียดผลลัพธ์
    const resultContent = document.getElementById('resultContent');
    resultContent.innerHTML = `
        <div class="result-detail"><strong>คะแนนรวมของคุณ:</strong> ${totalScore} / ${maxScore} คะแนน</div>
        <div class="result-detail"><strong>ดัชนีพฤติกรรมสะท้อนกลับ:</strong> ${overallPercent}%</div>
        <div class="result-footer">ประเมินเมื่อวันที่: ${dateStr}</div>
    `;

    // เปิดการแสดงผลกล่องลัพธ์และปุ่ม PDF
    document.getElementById('result').style.display = 'block';
    document.getElementById('actionButtons').style.display = 'block';

    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

// 4. ฟังก์ชันส่งออกเป็น PDF
function exportToPDF() {
    const element = document.getElementById('result');
    
    // ตั้งค่าตัวเลือกการแปลงไฟล์
    const opt = {
        margin:       10,
        filename:     'PSTI_Evaluation_Result.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // แปลงส่วน HTML และดาวน์โหลด PDF
    html2pdf().set(opt).from(element).save();
}

// เริ่มต้นสร้างแบบประเมิน
renderQuiz();
</script>

</body>
</html>
